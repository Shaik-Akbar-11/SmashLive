services:
  - type: web
    name: smashlive-backend
    env: node
    region: singapore
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: 24h
      - key: FRONTEND_URL
        sync: false
      - key: FAST2SMS_API_KEY
        sync: false
